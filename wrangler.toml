name = "aifreecalculator"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# Custom Domain Routes
routes = [
  { pattern = "aifreecalculator.com", custom_domain = true },
  { pattern = "www.aifreecalculator.com", custom_domain = true }
]

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "aifreecalculator_db"
database_id = "b130d2d6-11f5-4852-9ab3-36644d3948c7"

# Cloudflare Send Email Binding
[[send_email]]
name = "CONTACT_EMAIL"
destination_address = "indiarojgaarcom@gmail.com"

# Cloudflare KV Namespace for Sessions
[[kv_namespaces]]
binding = "SESSION"
id = "71736d60c3fd486a932bcbc5405d1a03"

# Cloudflare Observability Logs
[observability]
enabled = true

[vars]
PUBLIC_SITE_NAME = "AI Free Calculator"
PUBLIC_SITE_URL = "https://aifreecalculator.com"
CONTACT_NOTIFICATION_EMAIL = "indiarojgaarcom@gmail.com"
PUBLIC_GA_ID = "G-6LRLPH95P7"
PUBLIC_ADSENSE_CLIENT_ID = ""
