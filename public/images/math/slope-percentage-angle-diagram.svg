<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%" role="img" aria-labelledby="slopeChartTitle slopeChartDesc">
  <title id="slopeChartTitle">Slope Percentage vs Angle in Degrees Comparison Chart</title>
  <desc id="slopeChartDesc">A geometric comparison displaying multiple slope angles: 26.6 degrees (50 percent slope), 45 degrees (100 percent slope), and 63.4 degrees (200 percent slope), demonstrating that slope percentage can exceed 100 percent.</desc>
  <defs>
    <linearGradient id="chartBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="10" y="10" width="620" height="360" rx="20" fill="url(#chartBg)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Origin is at (100, 310). Base Run length = 200 px (representing 100% run) -->
  <!-- Horizontal Axis -->
  <line x1="100" y1="310" x2="520" y2="310" stroke="#0f172a" stroke-width="2.5"/>
  <text x="310" y="335" text-anchor="middle" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">
    Normalized Horizontal Run = 1.0 (100% base)
  </text>

  <!-- Vertical Axis at x=300 (Run = 200px) -->
  <line x1="300" y1="310" x2="300" y2="50" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Ray 1: 50% Slope (Angle ~26.57°) -> Rise = 100px (at y = 210) -->
  <line x1="100" y1="310" x2="450" y2="135" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <circle cx="300" cy="210" r="4.5" fill="#059669"/>
  <!-- Label 50% -->
  <g transform="translate(460, 135)">
    <rect x="0" y="-14" width="145" height="28" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="8" y="5" fill="#065f46" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">
      50% Slope (26.6°)
    </text>
  </g>

  <!-- Ray 2: 100% Slope (Angle 45°) -> Rise = 200px (at y = 110) -->
  <line x1="100" y1="310" x2="360" y2="50" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="300" cy="110" r="5" fill="#2563eb"/>
  <!-- Label 100% -->
  <g transform="translate(370, 52)">
    <rect x="0" y="-14" width="165" height="28" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="8" y="5" fill="#1e40af" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">
      ★ 100% Slope = 45.0°
    </text>
  </g>

  <!-- Ray 3: 200% Slope (Angle ~63.43°) -> Rise = 400px (at x=200, y=110 or from origin to (225, 60)) -->
  <line x1="100" y1="310" x2="225" y2="60" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <circle cx="200" cy="110" r="4.5" fill="#dc2626"/>
  <!-- Label 200% -->
  <g transform="translate(140, 42)">
    <rect x="0" y="-14" width="155" height="28" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="8" y="5" fill="#991b1b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">
      200% Slope (63.4°)
    </text>
  </g>

  <!-- 45 Degree Angle Arc -->
  <path d="M 170,310 A 70 70 0 0 0 150,260" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="175" y="278" fill="#1e40af" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">45°</text>

  <!-- Key Concept Explanatory Box Bottom Right -->
  <rect x="350" y="200" width="260" height="95" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="365" y="224" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">
    Key Mathematical Takeaway:
  </text>
  <text x="365" y="246" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">
    • 100% slope does NOT mean vertical (90°).
  </text>
  <text x="365" y="266" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">
    • 100% slope means Rise = Run (45°).
  </text>
  <text x="365" y="286" fill="#dc2626" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">
    • Slopes &gt; 100% are valid for angles &gt; 45°.
  </text>
</svg>
