<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="tri-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="360" rx="20" fill="url(#bg-grad)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Grid lines for geometric clarity -->
  <path d="M 80 60 L 80 270 M 140 60 L 140 270 M 200 60 L 200 270 M 260 60 L 260 270 M 320 60 L 320 270 M 380 60 L 380 270 M 440 60 L 440 270" stroke="#94a3b8" stroke-width="0.7" stroke-dasharray="3 3" opacity="0.4"/>
  <path d="M 80 90 L 440 90 M 80 150 L 440 150 M 80 210 L 440 210 M 80 270 L 440 270" stroke="#94a3b8" stroke-width="0.7" stroke-dasharray="3 3" opacity="0.4"/>

  <!-- Right Triangle Fill & Stroke -->
  <!-- Vertices: Right Angle C(100, 270), Top A(100, 80), Base B(390, 270) -->
  <path d="M 100 270 L 100 80 L 390 270 Z" fill="url(#tri-fill)" stroke="#2563eb" stroke-width="3.5" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- 90-Degree Right Angle Square Marker at C(100, 270) -->
  <path d="M 100 242 L 128 242 L 128 270" fill="none" stroke="#1e40af" stroke-width="2.5"/>
  <circle cx="114" cy="256" r="2.5" fill="#1e40af"/>

  <!-- Dimension Arrows and Side Labels -->
  <!-- Leg b (Vertical Height: x=75, from y=80 to y=270) -->
  <path d="M 75 82 L 75 268" stroke="#475569" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M 68 80 L 82 80 M 68 270 L 82 270" stroke="#475569" stroke-width="1.8"/>
  <rect x="25" y="158" width="44" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="47" y="177" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">b</text>
  <text x="47" y="196" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">(Height)</text>

  <!-- Leg a (Horizontal Base: from x=100 to x=390, y=295) -->
  <path d="M 102 295 L 388 295" stroke="#475569" stroke-width="1.8"/>
  <path d="M 100 288 L 100 302 M 390 288 L 390 302" stroke="#475569" stroke-width="1.8"/>
  <rect x="225" y="304" width="44" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="247" y="323" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">a</text>
  <text x="247" y="338" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">(Base)</text>

  <!-- Hypotenuse c (Slanted Side) -->
  <g transform="translate(265, 155) rotate(-33)">
    <rect x="-35" y="-18" width="70" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">c</text>
    <text x="0" y="12" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#94a3b8" text-anchor="middle">Hypotenuse</text>
  </g>

  <!-- Vertices Labels -->
  <circle cx="100" cy="80" r="5" fill="#2563eb"/>
  <text x="96" y="66" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#1e3a8a">A</text>

  <circle cx="390" cy="270" r="5" fill="#2563eb"/>
  <text x="406" y="276" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#1e3a8a">B</text>

  <circle cx="100" cy="270" r="5" fill="#dc2626"/>
  <text x="82" y="286" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#991b1b">C (90°)</text>

  <!-- Core Formula Callout Badge -->
  <rect x="340" y="45" width="170" height="92" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="425" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle" letter-spacing="0.5">RIGHT TRIANGLE AREA</text>
  <text x="425" y="98" font-family="monospace, serif" font-size="18" font-weight="900" fill="#0f172a" text-anchor="middle">Area = ½ · a · b</text>
  <text x="425" y="122" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">c = √(a² + b²)</text>
</svg>
