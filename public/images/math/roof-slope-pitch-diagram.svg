<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%" role="img" aria-labelledby="roofDiagramTitle roofDiagramDesc">
  <title id="roofDiagramTitle">Roof Slope and Pitch Diagram (X:12 Notation)</title>
  <desc id="roofDiagramDesc">Illustration of a roof rafter triangle displaying pitch X:12, horizontal run, vertical rise, sloped rafter length, and pitch angle.</desc>
  <defs>
    <linearGradient id="roofWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="roofSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <marker id="arrowAmber" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#d97706"/>
    </marker>
    <marker id="arrowSlate" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <!-- Card background -->
  <rect x="10" y="10" width="620" height="360" rx="20" fill="url(#roofSky)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- House roof attic framing polygon -->
  <polygon points="70,260 490,260 490,90" fill="#fef3c7" fill-opacity="0.45" stroke="#f59e0b" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Right angle indicator -->
  <path d="M 466,260 L 466,236 L 490,236" fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="478" cy="248" r="2.5" fill="#64748b"/>

  <!-- Horizontal Ceiling Joist / Run -->
  <line x1="70" y1="260" x2="490" y2="260" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <!-- Run dimension arrow -->
  <line x1="70" y1="285" x2="490" y2="285" stroke="#475569" stroke-width="1.5" marker-start="url(#arrowSlate)" marker-end="url(#arrowSlate)"/>
  <text x="280" y="310" text-anchor="middle" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">
    HORIZONTAL ROOF RUN (Base = 12 units)
  </text>
  <text x="280" y="330" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">
    Standard conventional building baseline is 12 inches (1 foot)
  </text>

  <!-- Vertical Ridge Rise -->
  <line x1="490" y1="260" x2="490" y2="90" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
  <line x1="515" y1="260" x2="515" y2="90" stroke="#d97706" stroke-width="1.5" marker-start="url(#arrowAmber)" marker-end="url(#arrowAmber)"/>
  <text x="528" y="170" fill="#b45309" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">
    RISE (X)
  </text>
  <text x="528" y="190" fill="#92400e" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">
    Rise per 12" run
  </text>

  <!-- Sloped Rafter Timber -->
  <line x1="70" y1="260" x2="490" y2="90" stroke="url(#roofWood)" stroke-width="7" stroke-linecap="round"/>

  <!-- Rafter Length Callout along hypotenuse -->
  <g transform="translate(265, 155) rotate(-22)">
    <rect x="-120" y="-22" width="240" height="42" rx="10" fill="#78350f" opacity="0.95"/>
    <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">
      RAFTER LENGTH L = √(Rise² + Run²)
    </text>
  </g>

  <!-- Pitch Triangle Mini-Callout on rafter -->
  <g transform="translate(200, 170)">
    <polygon points="0,0 55,0 55,-27" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="27" y="13" text-anchor="middle" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">12</text>
    <text x="63" y="-10" text-anchor="start" fill="#d97706" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">X</text>
  </g>

  <!-- Roof Angle Arc at Eaves -->
  <path d="M 130,260 A 60 60 0 0 0 126,238" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="140" y="248" fill="#1d4ed8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">θ (Roof Angle)</text>

  <!-- Pitch Formula Badge Top Left -->
  <rect x="30" y="30" width="230" height="75" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="45" y="54" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">
    Roof Pitch Convention:
  </text>
  <text x="45" y="74" fill="#d97706" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">
    Pitch Ratio = X : 12
  </text>
  <text x="45" y="93" fill="#2563eb" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">
    Angle = arctan(X / 12)
  </text>
</svg>
