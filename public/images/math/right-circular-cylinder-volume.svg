<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>

    <!-- Cylinder 3D Surface Gradient -->
    <linearGradient id="cyl-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="25%" stop-color="#60a5fa" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#93c5fd" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Top Base Gradient -->
    <linearGradient id="top-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 2 L 0 5 L 10 8 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 10 5 L 0 8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background Card -->
  <rect width="560" height="380" rx="20" fill="url(#bg-grad)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Subtle Coordinate/Alignment Grid -->
  <path d="M 60 80 L 500 80 M 60 180 L 500 180 M 60 290 L 500 290" stroke="#94a3b8" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.35"/>
  <path d="M 120 40 L 120 340 M 240 40 L 240 340 M 360 40 L 360 340" stroke="#94a3b8" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.35"/>

  <!-- CYLINDER GRAPHICS (Center X = 210) -->
  <!-- Cylinder Lateral Body Path: Left x=120, Right x=300, Top y=105, Bottom y=285 -->
  <!-- Radius = 90, Rx = 90, Ry = 28 -->

  <!-- Bottom Base Hidden (dashed back half) -->
  <path d="M 120 285 A 90 28 0 0 1 300 285" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 4"/>

  <!-- Cylinder Lateral Surface Fill -->
  <path d="M 120 105 L 120 285 A 90 28 0 0 0 300 285 L 300 105 Z" fill="url(#cyl-body)"/>

  <!-- Lateral Side Edges -->
  <line x1="120" y1="105" x2="120" y2="285" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="300" y1="105" x2="300" y2="285" stroke="#2563eb" stroke-width="2.5"/>

  <!-- Bottom Base Front (solid front half) -->
  <path d="M 120 285 A 90 28 0 0 0 300 285" fill="none" stroke="#2563eb" stroke-width="2.5"/>

  <!-- Top Base Ellipse (Full Solid) -->
  <ellipse cx="210" cy="105" rx="90" ry="28" fill="url(#top-base)" stroke="#2563eb" stroke-width="2.5" filter="url(#card-shadow)"/>

  <!-- Central Axis Line (Dashed) -->
  <line x1="210" y1="75" x2="210" y2="315" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 3"/>
  <circle cx="210" cy="105" r="3.5" fill="#1d4ed8"/>
  <circle cx="210" cy="285" r="3.5" fill="#1d4ed8"/>

  <!-- Right Angle Square Indicator at Center-Bottom -->
  <path d="M 210 267 L 226 267 L 226 285" fill="none" stroke="#1e40af" stroke-width="1.8"/>
  <circle cx="218" cy="276" r="1.8" fill="#1e40af"/>

  <!-- DIMENSION 1: Radius r (Top Base) -->
  <line x1="210" y1="105" x2="300" y2="105" stroke="#dc2626" stroke-width="2.2"/>
  <circle cx="300" cy="105" r="3" fill="#dc2626"/>
  <rect x="238" y="80" width="38" height="20" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="257" y="94" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#dc2626" text-anchor="middle">r</text>

  <!-- DIMENSION 2: Height h (Perpendicular Dimension Line on Left) -->
  <line x1="85" y1="110" x2="85" y2="280" stroke="#475569" stroke-width="1.8" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="75" y1="105" x2="120" y2="105" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="75" y1="285" x2="120" y2="285" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
  <rect x="52" y="180" width="66" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="85" y="196" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">h</text>
  <text x="85" y="206" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#64748b" text-anchor="middle">(Height)</text>

  <!-- DIMENSION 3: Diameter d (Bottom Base Span) -->
  <line x1="120" y1="324" x2="300" y2="324" stroke="#475569" stroke-width="1.8" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="120" y1="288" x2="120" y2="332" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="300" y1="288" x2="300" y2="332" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
  <rect x="186" y="312" width="48" height="24" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="210" y="328" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle">d = 2r</text>

  <!-- FORMULA & CONCEPT CALLOUT CARD (Right Side) -->
  <g transform="translate(345, 55)">
    <rect width="195" height="260" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="1.8" filter="url(#card-shadow)"/>

    <rect x="12" y="14" width="171" height="28" rx="8" fill="#eff6ff"/>
    <text x="97" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1e40af" text-anchor="middle" letter-spacing="0.4">
      RIGHT CIRCULAR CYLINDER
    </text>

    <!-- Base Area Equation -->
    <text x="18" y="66" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b">Circular Base Area:</text>
    <rect x="16" y="74" width="163" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="97" y="96" font-family="monospace, sans-serif" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">
      A = π × r²
    </text>

    <!-- Volume Equation -->
    <text x="18" y="128" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b">Cylinder Volume:</text>
    <rect x="16" y="136" width="163" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="97" y="162" font-family="monospace, sans-serif" font-size="17" font-weight="900" fill="#1d4ed8" text-anchor="middle">
      V = π · r² · h
    </text>

    <!-- Diameter Equation -->
    <text x="18" y="198" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b">Using Diameter (d):</text>
    <text x="97" y="218" font-family="monospace, sans-serif" font-size="13" font-weight="800" fill="#047857" text-anchor="middle">
      V = (π · d² · h) / 4
    </text>

    <!-- Key Property -->
    <line x1="20" y1="230" x2="175" y2="230" stroke="#e2e8f0" stroke-width="1"/>
    <text x="97" y="246" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="middle">
      h is strictly perpendicular (90°)
    </text>
  </g>
</svg>
