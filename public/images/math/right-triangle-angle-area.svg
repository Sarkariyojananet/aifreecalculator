<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="angle-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="angle-tri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="angle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#581c87" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="360" rx="20" fill="url(#angle-bg)" stroke="#d8b4fe" stroke-width="1.5"/>

  <!-- Triangle Polygon -->
  <!-- C(90, 270), A(90, 90), B(410, 270) -->
  <path d="M 90 270 L 90 90 L 410 270 Z" fill="url(#angle-tri)" stroke="#7e22ce" stroke-width="3.5" stroke-linejoin="round" filter="url(#angle-shadow)"/>

  <!-- Right Angle Square at C(90, 270) -->
  <path d="M 90 244 L 116 244 L 116 270" fill="none" stroke="#6b21a8" stroke-width="2.5"/>
  <circle cx="103" cy="257" r="2.5" fill="#6b21a8"/>

  <!-- Angle α Arc at Vertex B(410, 270) -->
  <!-- Arc radius 65, opening from angle ~209 deg to 180 deg -->
  <path d="M 345 270 A 65 65 0 0 0 353 238" fill="none" stroke="#d97706" stroke-width="3"/>
  <rect x="305" y="225" width="34" height="26" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="322" y="243" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#b45309" text-anchor="middle">α</text>

  <!-- Angle β Arc at Vertex A(90, 90) -->
  <!-- Arc radius 60, opening from 90 deg down toward hypotenuse -->
  <path d="M 90 150 A 60 60 0 0 0 138 117" fill="none" stroke="#059669" stroke-width="3"/>
  <rect x="115" y="125" width="34" height="26" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.2"/>
  <text x="132" y="143" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#047857" text-anchor="middle">β</text>

  <!-- Side Labels with Trigonometric Formulas -->
  <!-- Vertical Leg b = c * cos(α) = c * sin(β) -->
  <rect x="15" y="160" width="62" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="46" y="178" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">b (height)</text>
  <text x="46" y="194" font-family="monospace, serif" font-size="11" font-weight="700" fill="#7e22ce" text-anchor="middle">c · cos(α)</text>

  <!-- Horizontal Leg a = c * sin(α) = c * cos(β) -->
  <rect x="215" y="285" width="105" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="267" y="304" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">a (base)</text>
  <text x="267" y="321" font-family="monospace, serif" font-size="11" font-weight="700" fill="#7e22ce" text-anchor="middle">a = c · sin(α)</text>

  <!-- Hypotenuse c -->
  <g transform="translate(265, 160) rotate(-29)">
    <rect x="-45" y="-18" width="90" height="34" rx="8" fill="#581c87" stroke="#7e22ce" stroke-width="1"/>
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">Hypotenuse c</text>
    <text x="0" y="12" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#e9d5ff" text-anchor="middle">c = √(a² + b²)</text>
  </g>

  <!-- Trigonometric Formula Card -->
  <rect x="330" y="35" width="195" height="110" rx="14" fill="#ffffff" stroke="#9333ea" stroke-width="1.8" filter="url(#angle-shadow)"/>
  <text x="427" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#7e22ce" text-anchor="middle" letter-spacing="0.5">TRIGONOMETRIC AREA</text>
  <text x="427" y="88" font-family="monospace, serif" font-size="15" font-weight="900" fill="#0f172a" text-anchor="middle">Area = ½ · c² · sin(α) · cos(α)</text>
  <text x="427" y="112" font-family="monospace, serif" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">α + β = 90°</text>
  <text x="427" y="132" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">sin(α) = cos(β) = a / c</text>
</svg>
