<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%" role="img" aria-labelledby="rampDiagramTitle rampDiagramDesc">
  <title id="rampDiagramTitle">Wheelchair Ramp Slope and Geometry Diagram</title>
  <desc id="rampDiagramDesc">Educational illustration of a wheelchair ramp indicating horizontal run, vertical rise, ramp inclined surface length, top and bottom level landings, and slope angle.</desc>
  <defs>
    <linearGradient id="rampSurface" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="concrete" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <marker id="arrowRampSky" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#0284c7"/>
    </marker>
    <marker id="arrowRampSlate" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="620" height="360" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Lower Ground Landing (x: 40 to 140, y: 250) -->
  <rect x="40" y="250" width="100" height="30" fill="url(#concrete)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="90" y="270" text-anchor="middle" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Bottom Landing</text>

  <!-- Upper Porch Landing (x: 480 to 580, y: 130) -->
  <rect x="480" y="130" width="100" height="150" fill="url(#concrete)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="530" y="170" text-anchor="middle" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Top Landing</text>
  <text x="530" y="190" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Threshold Level</text>

  <!-- Ramp Incline Solid Wedge -->
  <polygon points="140,250 480,250 480,130" fill="#bae6fd" fill-opacity="0.35" stroke="#38bdf8" stroke-dasharray="3 3" stroke-width="1"/>

  <!-- Ramp Surface Decking -->
  <line x1="140" y1="250" x2="480" y2="130" stroke="url(#rampSurface)" stroke-width="6" stroke-linecap="round"/>

  <!-- Handrail Indicator above ramp -->
  <line x1="140" y1="215" x2="480" y2="95" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="140" y1="250" x2="140" y2="215" stroke="#94a3b8" stroke-width="2"/>
  <line x1="310" y1="190" x2="310" y2="155" stroke="#94a3b8" stroke-width="2"/>
  <line x1="480" y1="130" x2="480" y2="95" stroke="#94a3b8" stroke-width="2"/>

  <!-- Ramp Surface Length Callout along hypotenuse -->
  <g transform="translate(305, 172) rotate(-19.4)">
    <rect x="-110" y="-20" width="220" height="38" rx="8" fill="#0f172a" opacity="0.92"/>
    <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">
      RAMP LENGTH L = √(Rise² + Run²)
    </text>
  </g>

  <!-- Horizontal Run Dimension below wedge -->
  <line x1="140" y1="285" x2="480" y2="285" stroke="#475569" stroke-width="1.5" marker-start="url(#arrowRampSlate)" marker-end="url(#arrowRampSlate)"/>
  <text x="310" y="310" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">
    HORIZONTAL RUN = (Rise × 100) / Target Slope %
  </text>
  <text x="310" y="330" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">
    For 1:12 slope (8.33%), horizontal run must be 12 times the vertical rise
  </text>

  <!-- Vertical Rise Dimension -->
  <line x1="500" y1="250" x2="500" y2="130" stroke="#0284c7" stroke-width="1.5" marker-start="url(#arrowRampSky)" marker-end="url(#arrowRampSky)"/>
  <text x="512" y="195" fill="#0369a1" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">
    VERTICAL RISE
  </text>
  <text x="512" y="215" fill="#0284c7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">
    Total threshold rise
  </text>

  <!-- Slope Angle Theta -->
  <path d="M 190,250 A 50 50 0 0 0 187,233" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="200" y="244" fill="#6d28d9" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">θ (Ramp Angle)</text>

  <!-- Info Pill Top Left -->
  <rect x="30" y="25" width="280" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="45" y="47" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">
    Wheelchair Ramp Standard Baseline:
  </text>
  <text x="45" y="68" fill="#0284c7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">
    Slope Ratio: 1:12 (8.33% slope / ~4.76° angle)
  </text>
</svg>
