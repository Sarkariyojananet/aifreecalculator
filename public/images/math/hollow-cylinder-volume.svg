<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="hollow-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>

    <!-- Outer Shell Body Gradient (Solid Material Wall) -->
    <linearGradient id="outer-shell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.38"/>
      <stop offset="30%" stop-color="#34d399" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#6ee7b7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Hollow Core Gradient (Empty Interior) -->
    <linearGradient id="inner-core" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#f8fafc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Top Ring Material Gradient -->
    <linearGradient id="top-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="hollow-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 10 5 L 0 8 Z" fill="#047857"/>
    </marker>
    <marker id="arrow-start-gray" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 2 L 0 5 L 10 8 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-end-gray" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 10 5 L 0 8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background Card -->
  <rect width="560" height="380" rx="20" fill="url(#hollow-bg)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Subtle Coordinate Grid -->
  <path d="M 60 90 L 500 90 M 60 190 L 500 190 M 60 280 L 500 280" stroke="#94a3b8" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.35"/>

  <!-- HOLLOW CYLINDER GRAPHICS (Center X = 200) -->
  <!-- Outer dimensions: Rx = 85, Ry = 26, x from 115 to 285 -->
  <!-- Inner dimensions: rx = 50, ry = 15, x from 150 to 250 -->
  <!-- Top Y = 100, Bottom Y = 280 -->

  <!-- Outer Bottom Base Hidden Curve -->
  <path d="M 115 280 A 85 26 0 0 1 285 280" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Inner Bottom Base Hidden Curve -->
  <path d="M 150 280 A 50 15 0 0 1 250 280" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Outer Lateral Shell Surface Fill -->
  <path d="M 115 100 L 115 280 A 85 26 0 0 0 285 280 L 285 100 Z" fill="url(#outer-shell)"/>

  <!-- Inner Hollow Core (Translucent Interior Bore) -->
  <path d="M 150 100 L 150 280 A 50 15 0 0 0 250 280 L 250 100 Z" fill="url(#inner-core)"/>

  <!-- Inner Hollow Bore Side Lines (Dashed to denote inside) -->
  <line x1="150" y1="100" x2="150" y2="280" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="250" y1="100" x2="250" y2="280" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Outer Lateral Side Lines (Solid) -->
  <line x1="115" y1="100" x2="115" y2="280" stroke="#047857" stroke-width="2.5"/>
  <line x1="285" y1="100" x2="285" y2="280" stroke="#047857" stroke-width="2.5"/>

  <!-- Outer Bottom Base Front Curve -->
  <path d="M 115 280 A 85 26 0 0 0 285 280" fill="none" stroke="#047857" stroke-width="2.5"/>
  <!-- Inner Bottom Base Front Curve -->
  <path d="M 150 280 A 50 15 0 0 0 250 280" fill="none" stroke="#059669" stroke-width="1.8"/>

  <!-- TOP BASE RING: Fill outer ellipse with material, punch inner hole -->
  <!-- Outer Ellipse -->
  <path d="M 200 74 A 85 26 0 1 0 200 126 A 85 26 0 1 0 200 74 Z
           M 200 85 A 50 15 0 1 1 200 115 A 50 15 0 1 1 200 85 Z"
        fill="url(#top-ring)" fill-rule="evenodd" stroke="#047857" stroke-width="2.5" filter="url(#hollow-shadow)"/>

  <!-- Center Axis Line -->
  <line x1="200" y1="70" x2="200" y2="305" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 3"/>
  <circle cx="200" cy="100" r="3.5" fill="#047857"/>

  <!-- DIMENSION 1: Inner Radius r (Center to Inner Edge) -->
  <line x1="200" y1="100" x2="250" y2="100" stroke="#2563eb" stroke-width="2"/>
  <circle cx="250" cy="100" r="2.5" fill="#2563eb"/>
  <rect x="215" y="82" width="26" height="17" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="228" y="94" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#2563eb" text-anchor="middle">r</text>

  <!-- DIMENSION 2: Outer Radius R (Center to Outer Edge) -->
  <line x1="200" y1="100" x2="115" y2="100" stroke="#dc2626" stroke-width="2"/>
  <circle cx="115" cy="100" r="2.5" fill="#dc2626"/>
  <rect x="146" y="82" width="28" height="17" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="160" y="94" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#dc2626" text-anchor="middle">R</text>

  <!-- DIMENSION 3: Wall Thickness t (R - r) -->
  <line x1="250" y1="118" x2="285" y2="118" stroke="#d97706" stroke-width="2"/>
  <rect x="254" y="122" width="28" height="17" rx="3" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <text x="268" y="134" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#d97706" text-anchor="middle">t</text>

  <!-- DIMENSION 4: Height h (Perpendicular Dimension Line on Left) -->
  <line x1="85" y1="105" x2="85" y2="275" stroke="#475569" stroke-width="1.8" marker-start="url(#arrow-start-gray)" marker-end="url(#arrow-end-gray)"/>
  <line x1="75" y1="100" x2="115" y2="100" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="75" y1="280" x2="115" y2="280" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
  <rect x="52" y="175" width="66" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="85" y="191" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">h</text>
  <text x="85" y="201" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#64748b" text-anchor="middle">(Height)</text>

  <!-- HOLLOW FORMULA CALLOUT CARD (Right Side) -->
  <g transform="translate(330, 50)">
    <rect width="210" height="275" rx="14" fill="#ffffff" stroke="#059669" stroke-width="1.8" filter="url(#hollow-shadow)"/>

    <rect x="12" y="14" width="186" height="28" rx="8" fill="#ecfdf5"/>
    <text x="105" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#065f46" text-anchor="middle" letter-spacing="0.3">
      HOLLOW CYLINDRICAL SHELL
    </text>

    <!-- Cross-sectional Ring Area -->
    <text x="16" y="66" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b">Ring Cross-Section Area:</text>
    <rect x="14" y="74" width="182" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="105" y="96" font-family="monospace, sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">
      A = π × (R² − r²)
    </text>

    <!-- Primary Volume Formula -->
    <text x="16" y="128" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b">Material Shell Volume:</text>
    <rect x="14" y="136" width="182" height="42" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
    <text x="105" y="162" font-family="monospace, sans-serif" font-size="15" font-weight="900" fill="#047857" text-anchor="middle">
      V = π · (R² − r²) · h
    </text>

    <!-- Diameters Formula -->
    <text x="16" y="198" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b">Using Diameters (D, d):</text>
    <text x="105" y="218" font-family="monospace, sans-serif" font-size="12" font-weight="800" fill="#2563eb" text-anchor="middle">
      V = [π · (D² − d²) · h] / 4
    </text>

    <!-- Geometric Constraint Alert -->
    <rect x="14" y="232" width="182" height="30" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="105" y="251" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#b91c1c" text-anchor="middle">
      Condition: R &gt; r &gt; 0 (Wall: t = R − r)
    </text>
  </g>
</svg>
