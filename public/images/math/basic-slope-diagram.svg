<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" height="100%" role="img" aria-labelledby="slopeDiagramTitle slopeDiagramDesc">
  <title id="slopeDiagramTitle">Basic Slope Triangle: Rise, Run, and Slope Angle Diagram</title>
  <desc id="slopeDiagramDesc">A right triangle illustrating the mathematical definition of slope: horizontal run along the base, vertical rise along the perpendicular side, the inclined slope line, right angle symbol, and slope angle theta.</desc>
  <defs>
    <linearGradient id="slopeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="fillGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.18"/>
    </linearGradient>
    <marker id="arrowHeadBlue" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowHeadEmerald" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrowHeadPurple" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Background container card -->
  <rect x="10" y="10" width="620" height="360" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Right Triangle Fill: (80, 270) to (480, 270) to (480, 80) -->
  <polygon points="80,270 480,270 480,80" fill="url(#fillGrad)" stroke="none"/>

  <!-- Right Angle Square at (480, 270) -->
  <path d="M 456,270 L 456,246 L 480,246" fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="468" cy="258" r="2.5" fill="#64748b"/>

  <!-- Angle Theta Arc at (80, 270) -->
  <path d="M 140,270 A 60 60 0 0 0 133,245" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="148" y="258" fill="#7c3aed" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">θ (Angle)</text>

  <!-- Horizontal Run Line -->
  <line x1="80" y1="270" x2="480" y2="270" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Run Dimension Guide -->
  <line x1="80" y1="295" x2="480" y2="295" stroke="#059669" stroke-width="1.5" marker-start="url(#arrowHeadEmerald)" marker-end="url(#arrowHeadEmerald)"/>
  <text x="280" y="322" text-anchor="middle" fill="#065f46" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">
    HORIZONTAL RUN (x)
  </text>
  <text x="280" y="342" text-anchor="middle" fill="#047857" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">
    Horizontal distance traveled
  </text>

  <!-- Vertical Rise Line -->
  <line x1="480" y1="270" x2="480" y2="80" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Rise Dimension Guide -->
  <line x1="505" y1="270" x2="505" y2="80" stroke="#2563eb" stroke-width="1.5" marker-start="url(#arrowHeadBlue)" marker-end="url(#arrowHeadBlue)"/>
  <text x="518" y="170" fill="#1e40af" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">
    VERTICAL RISE (y)
  </text>
  <text x="518" y="190" fill="#2563eb" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">
    Vertical elevation change
  </text>

  <!-- Inclined Slope Line (Hypotenuse) -->
  <line x1="80" y1="270" x2="480" y2="80" stroke="url(#slopeGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Slope Label Callout along hypotenuse -->
  <g transform="translate(250, 150) rotate(-25.4)">
    <rect x="-105" y="-22" width="210" height="42" rx="10" fill="#1e293b" opacity="0.92"/>
    <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">
      SLOPE = RISE / RUN
    </text>
  </g>

  <!-- Top Vertex Points -->
  <circle cx="80" cy="270" r="5" fill="#1e293b"/>
  <circle cx="480" cy="80" r="5" fill="#1e293b"/>
  <circle cx="480" cy="270" r="5" fill="#1e293b"/>

  <!-- Formula Summary Badge Top Left -->
  <rect x="30" y="30" width="250" height="75" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="45" y="54" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">
    Core Slope Formulas:
  </text>
  <text x="45" y="74" fill="#2563eb" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">
    Slope Ratio = Rise / Run
  </text>
  <text x="45" y="93" fill="#059669" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">
    Slope % = (Rise / Run) × 100
  </text>
</svg>
