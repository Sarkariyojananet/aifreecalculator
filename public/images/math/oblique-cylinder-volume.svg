<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="oblique-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#faf5ff"/>
    </linearGradient>

    <!-- Oblique Lateral Body Gradient -->
    <linearGradient id="oblique-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.32"/>
      <stop offset="30%" stop-color="#c084fc" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#e9d5ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Top Base Gradient -->
    <linearGradient id="oblique-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="oblique-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <marker id="arrow-purple-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 2 L 0 5 L 10 8 Z" fill="#7e22ce"/>
    </marker>
    <marker id="arrow-purple-end" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 10 5 L 0 8 Z" fill="#7e22ce"/>
    </marker>
    <marker id="arrow-gray-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 2 L 0 5 L 10 8 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-gray-end" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 10 5 L 0 8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background Card -->
  <rect width="560" height="380" rx="20" fill="url(#oblique-bg)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Subtle Coordinate Grid Lines -->
  <path d="M 40 105 L 520 105 M 40 285 L 520 285" stroke="#94a3b8" stroke-width="0.7" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- OBLIQUE CYLINDER GRAPHICS -->
  <!-- Bottom Base: Center (160, 285), Rx = 70, Ry = 22 -->
  <!-- Top Base: Shifted horizontally by dx = 80 -> Center (240, 105), Rx = 70, Ry = 22 -->
  <!-- Left Side: from (90, 285) to (170, 105) -->
  <!-- Right Side: from (230, 285) to (310, 105) -->

  <!-- Parallel Base Plane Extension Lines -->
  <line x1="40" y1="105" x2="330" y2="105" stroke="#9333ea" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="40" y1="285" x2="330" y2="285" stroke="#9333ea" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Bottom Base Hidden Half Curve (dashed) -->
  <path d="M 90 285 A 70 22 0 0 1 230 285" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Oblique Cylinder Lateral Surface Fill -->
  <path d="M 90 285 L 170 105 A 70 22 0 0 0 310 105 L 230 285 A 70 22 0 0 1 90 285 Z" fill="url(#oblique-body)"/>

  <!-- Lateral Side Edges (Slanted) -->
  <line x1="90" y1="285" x2="170" y2="105" stroke="#7e22ce" stroke-width="2.5"/>
  <line x1="230" y1="285" x2="310" y2="105" stroke="#7e22ce" stroke-width="2.5"/>

  <!-- Bottom Base Front Half (solid) -->
  <path d="M 90 285 A 70 22 0 0 0 230 285" fill="none" stroke="#7e22ce" stroke-width="2.5"/>

  <!-- Top Base Ellipse (Full Solid) -->
  <ellipse cx="240" cy="105" rx="70" ry="22" fill="url(#oblique-top)" stroke="#7e22ce" stroke-width="2.5" filter="url(#oblique-shadow)"/>

  <!-- Top Center & Radius r -->
  <circle cx="240" cy="105" r="3.5" fill="#7e22ce"/>
  <line x1="240" y1="105" x2="310" y2="105" stroke="#dc2626" stroke-width="2"/>
  <circle cx="310" cy="105" r="2.5" fill="#dc2626"/>
  <rect x="265" y="85" width="28" height="17" rx="3" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="279" y="97" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#dc2626" text-anchor="middle">r</text>

  <!-- PERPENDICULAR HEIGHT h (Vertical Drop Line from Top Edge x=170 to Bottom Plane y=285) -->
  <!-- Height drop line from (170, 105) down to (170, 285) -->
  <line x1="170" y1="105" x2="170" y2="285" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="5 3"/>
  <circle cx="170" cy="285" r="3" fill="#dc2626"/>

  <!-- Right Angle Indicator at (170, 285) showing perpendicular height -->
  <path d="M 170 268 L 153 268 L 153 285" fill="none" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="161" cy="276" r="1.5" fill="#dc2626"/>

  <!-- Height Dimension Callout -->
  <line x1="55" y1="110" x2="55" y2="280" stroke="#475569" stroke-width="1.8" marker-start="url(#arrow-gray-start)" marker-end="url(#arrow-gray-end)"/>
  <line x1="45" y1="105" x2="170" y2="105" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="45" y1="285" x2="90" y2="285" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
  <rect x="24" y="180" width="62" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="55" y="196" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#dc2626" text-anchor="middle">h</text>
  <text x="55" y="206" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#64748b" text-anchor="middle">(Perp. Height)</text>

  <!-- SLANT LENGTH L (Dimension along the tilted lateral side) -->
  <!-- Tilted side from (90, 285) to (170, 105). Angle with horizontal is approx 66° -->
  <g transform="translate(118, 192) rotate(-66)">
    <rect x="-26" y="-22" width="52" height="20" rx="4" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.2"/>
    <text x="0" y="-8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#7e22ce" text-anchor="middle">Slant L</text>
  </g>

  <!-- SLANT INCLINATION ANGLE θ at (90, 285) -->
  <path d="M 125 285 A 35 35 0 0 0 106 250" fill="none" stroke="#d97706" stroke-width="2"/>
  <text x="128" y="272" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#d97706">θ</text>

  <!-- FORMULA & CAVALIERI CALLOUT CARD (Right Side) -->
  <g transform="translate(340, 50)">
    <rect width="205" height="275" rx="14" fill="#ffffff" stroke="#9333ea" stroke-width="1.8" filter="url(#oblique-shadow)"/>

    <rect x="12" y="14" width="181" height="28" rx="8" fill="#faf5ff"/>
    <text x="102" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#6b21a8" text-anchor="middle" letter-spacing="0.4">
      OBLIQUE / SLANTED CYLINDER
    </text>

    <!-- Cavalieri's Principle Callout -->
    <rect x="12" y="52" width="181" height="48" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="102" y="68" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#b91c1c" text-anchor="middle">
      CRITICAL RULE:
    </text>
    <text x="102" y="82" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle">
      Slant length L ≠ Perpendicular height h
    </text>
    <text x="102" y="93" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#7f1d1d" text-anchor="middle">
      Volume uses perpendicular distance only!
    </text>

    <!-- Volume Formula with Perpendicular Height -->
    <text x="16" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b">Given Perpendicular Height:</text>
    <rect x="14" y="126" width="177" height="38" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.2"/>
    <text x="102" y="150" font-family="monospace, sans-serif" font-size="15" font-weight="900" fill="#7e22ce" text-anchor="middle">
      V = π · r² · h
    </text>

    <!-- Volume Formula with Slant Length & Angle -->
    <text x="16" y="184" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b">Given Slant Length L &amp; Angle θ:</text>
    <rect x="14" y="190" width="177" height="48" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="102" y="208" font-family="monospace, sans-serif" font-size="12" font-weight="800" fill="#0f172a" text-anchor="middle">
      h = L × sin(θ)
    </text>
    <text x="102" y="226" font-family="monospace, sans-serif" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">
      V = π · r² · [L · sin(θ)]
    </text>

    <line x1="20" y1="248" x2="185" y2="248" stroke="#e2e8f0" stroke-width="1"/>
    <text x="102" y="263" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#64748b" text-anchor="middle">
      Cavalieri's Principle: Equal Base &amp; Height
    </text>
  </g>
</svg>
