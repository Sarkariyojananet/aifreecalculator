<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="iso-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="iso-tri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="iso-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#064e3b" flood-opacity="0.09"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="540" height="360" rx="20" fill="url(#iso-bg)" stroke="#a7f3d0" stroke-width="1.5"/>

  <!-- 45-45-90 Isosceles Right Triangle: Equal Legs a = b = 200px -->
  <!-- C(110, 280), A(110, 80), B(310, 280) -->
  <path d="M 110 280 L 110 80 L 310 280 Z" fill="url(#iso-tri)" stroke="#059669" stroke-width="3.5" stroke-linejoin="round" filter="url(#iso-shadow)"/>

  <!-- 90-Degree Right Angle Square Marker -->
  <path d="M 110 254 L 136 254 L 136 280" fill="none" stroke="#047857" stroke-width="2.5"/>
  <circle cx="123" cy="267" r="2.5" fill="#047857"/>

  <!-- Hash Marks for Equal Legs (a = b) -->
  <!-- Vertical Leg Hash Mark at (110, 180) -->
  <line x1="102" y1="180" x2="118" y2="180" stroke="#047857" stroke-width="2.5"/>
  <!-- Horizontal Leg Hash Mark at (210, 280) -->
  <line x1="210" y1="272" x2="210" y2="288" stroke="#047857" stroke-width="2.5"/>

  <!-- 45° Angle Arc at Vertex A(110, 80) -->
  <path d="M 110 135 A 55 55 0 0 0 148 118" fill="none" stroke="#0284c7" stroke-width="2.5"/>
  <rect x="120" y="125" width="46" height="24" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/>
  <text x="143" y="141" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#0369a1" text-anchor="middle">45°</text>

  <!-- 45° Angle Arc at Vertex B(310, 280) -->
  <path d="M 255 280 A 55 55 0 0 0 271 242" fill="none" stroke="#0284c7" stroke-width="2.5"/>
  <rect x="235" y="235" width="46" height="24" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/>
  <text x="258" y="251" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#0369a1" text-anchor="middle">45°</text>

  <!-- Leg Labels showing a = b -->
  <rect x="40" y="165" width="55" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="67" y="185" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#0f172a" text-anchor="middle">a = x</text>

  <rect x="185" y="295" width="55" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="212" y="315" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#0f172a" text-anchor="middle">b = x</text>

  <!-- Hypotenuse c = a * sqrt(2) -->
  <g transform="translate(225, 168) rotate(-45)">
    <rect x="-55" y="-18" width="110" height="36" rx="8" fill="#065f46" stroke="#047857" stroke-width="1"/>
    <text x="0" y="0" font-family="monospace, serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">c = a√2 ≈ 1.414a</text>
    <text x="0" y="13" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#a7f3d0" text-anchor="middle">Hypotenuse</text>
  </g>

  <!-- Mathematical Properties Box -->
  <rect x="330" y="45" width="190" height="155" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="1.8" filter="url(#iso-shadow)"/>
  <text x="425" y="72" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#047857" text-anchor="middle" letter-spacing="0.5">45°-45°-90° SPECIAL CASE</text>

  <text x="345" y="100" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">• Equal legs:</text>
  <text x="440" y="100" font-family="monospace, serif" font-size="13" font-weight="900" fill="#0f172a">a = b</text>

  <text x="345" y="125" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">• Hypotenuse:</text>
  <text x="440" y="125" font-family="monospace, serif" font-size="13" font-weight="900" fill="#047857">c = a√2</text>

  <text x="345" y="150" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">• Leg from hyp:</text>
  <text x="440" y="150" font-family="monospace, serif" font-size="13" font-weight="900" fill="#047857">a = c / √2</text>

  <line x1="345" y1="162" x2="505" y2="162" stroke="#e2e8f0" stroke-width="1"/>

  <text x="425" y="185" font-family="monospace, serif" font-size="15" font-weight="900" fill="#0f172a" text-anchor="middle">Area = a² / 2 = c² / 4</text>
</svg>
